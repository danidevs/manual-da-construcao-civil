[project]
name = "cope"
version = "0.1.0"
description = "COPE - Colher de Pedreiro Executiva: Inteligência Artificial para Canteiro de Obras"
authors = [{ name = "Daniel", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]>=1.15.28,<2.0.0",
    "fastapi>=0.159.1",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
cope = "cope.main:run"
run_crew = "cope.main:run"
train = "cope.main:train"
replay = "cope.main:replay"
test = "cope.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "39144100-8008-4f8d-b695-890923e09757"

[tool.hatch.build.targets.wheel]
packages = ["src/cope"]
