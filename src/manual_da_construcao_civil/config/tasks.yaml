# src/manual_da_construcao_civil/config/tasks.yaml

tarefa_arquitetura:
  description: >
    Crie as diretrizes iniciais do manual focando no planejamento do layout residencial. 
    Explique como definir o posicionamento dos comodos, o aproveitamento do terreno, 
    a circulacao interna e a entrada de luz solar e ventilacao.
  expected_output: >
    Um guia de planejamento de layout e conceitos de arquitetura para a casa.
  agent: arquiteto

tarefa_estrutura_civil:
  description: >
    Com base no layout do Arquiteto, defina as instrucoes tecnicas para a infraestrutura. 
    Descreva o passo a passo para a marcacao do terreno, abertura de valas, execucao da fundacao 
    (alicerce) e a montagem das colunas, vigas e laje.
  expected_output: >
    Um manual tecnico de fundacoes e estruturas com tracos de concreto e normas de seguranca.
  agent: engenheiro_civil

tarefa_instalacao_eletrica:
  description: >
    Com a estrutura definida, adicione as diretrizes para a rede eletrica da casa. 
    Explique o posicionamento das caixas de luz, a passagem dos conduites pelas paredes e laje, 
    o dimensionamento dos cabos e a montagem do quadro de disjuntores.
  expected_output: >
    Um passo a passo tecnico para a instalacao da rede eletrica residencial com foco em seguranca.
  agent: engenheiro_eletrico

tarefa_planejamento_canteiro:
  description: >
    Reuna as informacoes dos engenheiros e do arquiteto para organizar a rotina do canteiro. 
    Defina o cronograma pratico de execucao, a logistica para receber e estocar materiais 
    e as instrucoes de lideranca para coordenar a equipe na obra.
  expected_output: >
    Um plano de gerenciamento de obra e logistica para orientar o mestre de obras.
  agent: mestre_de_obras

tarefa_erguer_alvenaria:
  description: >
    Crie as instrucoes praticas para levantar as paredes da casa seguindo o plano do Mestre. 
    Explique como fazer a massa de assentamento, o uso correto do prumo, nivel e linha, 
    e o travamento correto dos tijolos ou blocos.
  expected_output: >
    Um guia pratico detalhado para o levantamento de paredes e alvenaria estrutural.
  agent: pedreiro_alvenaria

tarefa_aplicar_acabamento:
  description: >
    Com as paredes erguidas, descreva o processo de preparacao das superficies e pisos. 
    Explique o passo a passo para fazer o chapisco, o reboco das paredes, o nivelamento do contra-piso 
    e o assentamento correto de pisos e azulejos.
  expected_output: >
    Um manual de acabamento cobrindo reboco, contra-piso e assentamento de revestimentos.
  agent: pedreiro_acabamento

tarefa_pintura_final:
  description: >
    Finalize o manual descrevendo a etapa de pintura e protecao das superficies. 
    Explique a limpeza das paredes, a aplicacao de selador, o uso da massa corrida para corrigir 
    imperfeicoes, o lixamento e a tecnica de aplicacao das demos de tinta.
  expected_output: >
    O capitulo final do manual focado na preparacao e pintura residencial completa.
  agent: pintor
